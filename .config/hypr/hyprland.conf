# Learn how to configure Hyprland: https://wiki.hyprland.org/Configuring/

# Use defaults Omarchy defaults (but don't edit these directly!)
source = ~/.local/share/omarchy/default/hypr/autostart.conf
source = ~/.local/share/omarchy/default/hypr/bindings/media.conf
source = ~/.local/share/omarchy/default/hypr/bindings/clipboard.conf
source = ~/.local/share/omarchy/default/hypr/bindings/tiling-v2.conf
source = ~/.local/share/omarchy/default/hypr/bindings/utilities.conf
source = ~/.local/share/omarchy/default/hypr/envs.conf
source = ~/.local/share/omarchy/default/hypr/looknfeel.conf
source = ~/.local/share/omarchy/default/hypr/input.conf
source = ~/.local/share/omarchy/default/hypr/windows.conf

# Change your own setup in these files (and overwrite any settings from defaults!)
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/autostart.conf

# Add any other personal Hyprland configuration below
# windowrule = workspace 5, class:qemu

# Remove btop from floating-window tag and give it a larger size
windowrule = tag -floating-window, match:class org.omarchy.btop
windowrule = float on, match:class org.omarchy.btop
windowrule = center on, match:class org.omarchy.btop
windowrule = size 1800 1200, match:class org.omarchy.btop

# Fix screensaver fullscreen (Hyprland 0.53+ syntax)
windowrule = fullscreen on, match:class org.omarchy.screensaver
windowrule = float on, match:class org.omarchy.screensaver

# Gaming window rules - prevent video corruption on workspace switch
windowrule = opacity 1 1, match:class steam_app
windowrule = no_blur on, match:class steam_app
windowrule = no_shadow on, match:class steam_app
windowrule = focus_on_activate on, match:class steam_app

# Enshrouded (2079670) - fix alt-tab focus and render stalls
windowrule = immediate on, match:class steam_app_2079670
windowrule = render_unfocused on, match:class steam_app_2079670
windowrule = idle_inhibit always, match:class steam_app_2079670

# WoW Classic (Lutris/Wine) - fullscreen windowed without Waybar gap
windowrule = fullscreen on, match:class steam_app_default, match:title World of Warcraft
windowrule = immediate on, match:class steam_app_default, match:title World of Warcraft
windowrule = idle_inhibit always, match:class steam_app_default, match:title World of Warcraft

# NVIDIA environment variables
env = NVD_BACKEND,direct
env = LIBVA_DRIVER_NAME,iHD
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

# Toggle config flags dynamically
source = ~/.local/state/omarchy/toggles/hypr/*.conf
