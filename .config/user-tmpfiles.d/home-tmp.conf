# Age out ~/tmp, which nothing else ever cleans.
#
# .zshenv sets TMPDIR="$HOME/tmp" on Linux because /tmp is tmpfs on these
# machines (desktop 16G, minipc 2.9G) and large temp files written there are
# held in RAM. The side effect is that this directory escapes /tmp cleanup,
# which only ever applies to /tmp itself, never to a path under $HOME. By
# Aug 2026 it held 4701 entries dating back to February: playwright profiles,
# metro and node compile caches, jest and pytest scratch, stray archives.
#
# 30d matches what /tmp would have done anyway. Everything landing here is
# regenerable by definition, and restic skips the whole tree (see
# ~/.config/restic/excludes).
#
# Cleaning is driven by the user timer, which must be enabled per machine:
#     systemctl --user enable --now systemd-tmpfiles-clean.timer
#
# Age is measured on atime/mtime/ctime, so files still being read are kept.
# The directory itself is created if missing but never removed.
d %h/tmp 0700 - - 30d
